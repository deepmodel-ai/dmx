name: validate
skills:
  - validate
trigger:
  type: on_complete
goal_state: "All required checks pass, code reviewed, ready for PR"
validators:
  - tool: run_tests
    timeout_seconds: 630
    checks:
      - name: tests_pass
        required: true
  - tool: spec_adherence
    checks:
      - name: scope_matches_spec
        required: true
      - name: no_regressions
        required: true
on_optional_failure: warn
failure_handling: pause
human_gate: true
on_complete:
  on_success:
    trigger_loop: release
  on_failure:
    # A failed required check becomes a rework phase in tasks.md. After
    # approval, dev implements it and validate runs again (GH-115).
    rework:
      loop: dev
      max_rounds: 2
      approve: true
  on_warning:
    trigger_loop: null
