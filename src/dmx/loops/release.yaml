name: release
skills:
  - create-pr
trigger:
  type: on_complete
goal_state: "PR created, ticket transitioned to review, memory bank updated"
validators:
  - tool: check_pr_ready
    checks:
      - name: pr_exists
        required: true
      - name: ticket_transitioned
        required: true
      - name: memory_updated
        required: false
on_optional_failure: warn
failure_handling: pause
human_gate: true
on_complete:
  on_success:
    trigger_loop: null
  on_failure:
    trigger_loop: null
  on_warning:
    trigger_loop: null
