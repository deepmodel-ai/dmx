name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      # run_tests detects go.mod; the macOS runners have no Go, so those
      # tests would skip there without this.
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      # The reference monorepo's pnpm package runs through run_tests (GH-89).
      # Node and Rust come with the runner images.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # The yarn workspace default command runs for real too.
      - name: Ensure yarn
        shell: bash
        run: command -v yarn || npm install -g yarn

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint — ruff check
        run: uv run ruff check src/ tests/

      - name: Lint — ruff format
        run: uv run ruff format --check src/ tests/

      - name: Type check — mypy
        run: uv run mypy src/

      - name: Test
        env:
          # Fail, rather than skip, a reference monorepo test whose toolchain is missing.
          DMX_REQUIRE_TOOLCHAINS: "1"
        run: uv run python -m pytest --cov --cov-fail-under=75 -q
